spring:
  datasource:
    url: jdbc:h2:mem:crossfit;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

jwt:
  issuer: test
  secret: test-secret-test-secret-test-secret-test-secret
  access-token-validity-seconds: 3600

server:
  port: 0
