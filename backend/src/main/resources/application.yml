        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    issuer: crossfit
    secret: change-this-dev-secret-change-this-dev-secret
    access-token-minutes: 120
